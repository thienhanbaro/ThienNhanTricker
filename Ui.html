<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    html, body { height: 100vh !important; width: 100vw !important; overflow: hidden !important; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    i.fa-solid, i.fa-regular, i.fa-brands { font-family: "Font Awesome 6 Free","Font Awesome 6 Brands" !important; }
    
    body { background: #f1f5f9; color: #0f172a; display: flex; }
    body.dark { background: #000; color: #f8fafc; }

    .sidebar { width: 200px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 16px 12px; height: 100%; }
    body.dark .sidebar { background: #0a0a0a; border-right-color: #222; }

    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
    body.dark .logo { border-bottom-color: #222; }
    .logo i { font-size: 20px; color: #3b82f6; }
    .logo span { font-weight: 900; font-size: 15px; }

    .menu { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .menu-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; color: #64748b; display: flex; align-items: center; gap: 10px; transition: 0.2s; border: 1px solid transparent; }
    body.dark .menu-item { color: #888; }
    .menu-item:hover { background: #f1f5f9; color: #0f172a; }
    body.dark .menu-item:hover { background: #111; color: #f8fafc; }
    .menu-item.active { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
    body.dark .menu-item.active { background: rgba(59,130,246,0.15); color: #60a5fa; border-color: rgba(59,130,246,0.3); }

    .support { padding: 14px; border-radius: 12px; background: #fff; border: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    body.dark .support { background: #111; border-color: #222; }
    .support-header { font-size: 10px; font-weight: 800; color: #64748b; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .support-profile { display: flex; align-items: center; gap: 10px; }
    .support-profile img { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #3b82f6; object-fit: cover; }
    .support-profile div { display: flex; flex-direction: column; }
    .support-profile span:first-child { font-size: 11px; font-weight: 900; }
    .support-profile span:last-child { font-size: 10px; color: #64748b; }
    .btn-zalo { padding: 8px; border-radius: 8px; border: none; background: #0068ff; color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }

    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }
    .topbar { padding: 14px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; }
    body.dark .topbar { background: #000; border-bottom-color: #222; }
    .title h2 { font-size: 18px; font-weight: 900; margin: 0; }
    .title p { font-size: 11px; color: #64748b; margin-top: 2px; margin-bottom: 0; }
    .actions { display: flex; gap: 10px; }
    .btn-icon { width: 34px; height: 34px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; color: #0f172a; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    body.dark .btn-icon { background: #111; border-color: #222; color: #f8fafc; }
    .btn-icon.close { color: #ef4444; }

    .body-area { flex: 1; overflow-y: auto; padding: 24px; background: #f1f5f9; }
    body.dark .body-area { background: #000; }

    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    body.dark .card { background: #111; border-color: #222; }
    .card-title { font-size: 16px; font-weight: 900; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    body.dark .card-title { border-bottom-color: #222; }

    .grid-stats { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .stat-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
    body.dark .stat-box { background: #111; border-color: #222; }
    .stat-box span:first-child { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 8px; }
    .stat-box span:last-child { font-size: 24px; font-weight: 900; }

    .grid-charts { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 24px; }
    .chart-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    body.dark .chart-card { background: #111; border-color: #222; }
    .donut { width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(#3b82f6 0%, #e2e8f0 0); display: flex; align-items: center; justify-content: center; }
    .donut-inner { width: 90px; height: 90px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    body.dark .donut-inner { background: #111; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .input-group { display: flex; flex-direction: column; margin-bottom: 12px; }
    .input-group label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
    .input-group input, .input-group textarea { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: monospace; background: #f8fafc; }
    body.dark .input-group input, body.dark .input-group textarea { background: #000; border-color: #222; color: #f8fafc; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 900; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; }

    .acc-table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    .acc-table th { text-align: left; padding: 12px; background: #f8fafc; font-size: 11px; font-weight: 800; color: #64748b; border-bottom: 1px solid #e2e8f0; }
    body.dark .acc-table th { background: #000; border-bottom-color: #222; }
    .acc-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    body.dark .acc-table td { border-bottom-color: #222; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; }
    .badge.live { background: rgba(16,185,129,0.1); color: #10b981; }
    .badge.die { background: rgba(239,68,68,0.1); color: #ef4444; }
</style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><i class="fa-solid fa-bolt"></i> <span>DAME PRO</span></div>
        <div class="menu">
            <div class="menu-item active" data-tab="home"><i class="fa-solid fa-chart-pie"></i> Tổng Quan</div>
            <div class="menu-item" data-tab="settings"><i class="fa-solid fa-sliders"></i> Cấu Hình</div>
            <div class="menu-item" data-tab="accounts"><i class="fa-solid fa-users-viewfinder"></i> Quản Lý Acc</div>
            <div class="menu-item" data-tab="logs"><i class="fa-solid fa-terminal"></i> Lịch Sử Log</div>
        </div>
        <div class="support">
            <div class="support-header"><i class="fa-solid fa-headset"></i> Hỗ trợ 24/7</div>
            <div class="support-profile">
                <img src="https://ui-avatars.com/api/?name=Le+Thien+Nhan&background=3b82f6&color=fff&rounded=true&bold=true">
                <div><span>Le Thien Nhan Tricker</span><span>Quản trị viên</span></div>
            </div>
            <button class="btn-zalo" onclick="openZalo()"><i class="fa-solid fa-comment-dots"></i> Liên Hệ Zalo</button>
        </div>
    </div>
    <div class="content">
        <div class="topbar">
            <div class="title"><h2 id="page-title">Hệ Thống Dame</h2><p>Phiên bản 15.2.0 · Tự động hóa TikTok</p></div>
            <div class="actions">
                <button class="btn-icon" id="btn-theme"><i class="fa-solid fa-moon"></i></button>
                <button class="btn-icon" id="btn-min"><i class="fa-solid fa-minus"></i></button>
                <button class="btn-icon close" id="btn-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div class="body-area" id="body-area"></div>
    </div>

<script>
    function sendToTool(action, data) { window.parent.postMessage({ action, data }, '*'); }
    function openZalo() { window.open("https://zalo.me/0353354971", "_blank"); }
    
    let currentState = {};
    let currentTab = 'home';

    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', () => {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
            currentTab = item.dataset.tab;
            renderUI(currentState);
        });
    });

    let isDark = false;
    document.getElementById('btn-theme').addEventListener('click', () => {
        isDark = !isDark;
        document.body.classList.toggle('dark', isDark);
        document.getElementById('btn-theme').innerHTML = `<i class="fa-solid fa-${isDark ? 'sun' : 'moon'}"></i>`;
        sendToTool('setTheme', isDark ? 'dark' : 'light');
    });

    document.getElementById('btn-min').addEventListener('click', () => sendToTool('minimize'));
    document.getElementById('btn-close').addEventListener('click', () => sendToTool('close'));

    function renderUI(state) {
        if (!state) return;
        currentState = state;
        const body = document.getElementById('body-area');
        body.innerHTML = '';

        const titles = { home: "Hệ Thống Dame", settings: "Cấu Hình", accounts: "Quản Lý Acc", logs: "Lịch Sử Log" };
        document.getElementById('page-title').innerText = titles[currentTab] || "Hệ Thống";

        if (currentTab === 'home') {
            body.innerHTML = `
                <div class="grid-stats">
                    <div class="stat-box"><span>TỔNG ĐÃ GỬI</span><span>${state.totalSent || 0}</span></div>
                    <div class="stat-box"><span>VÒNG HIỆN TẠI</span><span>${state.loopDone || 0}/${state.loopCount || 0}</span></div>
                    <div class="stat-box"><span>TỔNG ACCOUNT</span><span>${state.accounts?.length || 0}</span></div>
                    <div class="stat-box"><span>TRẠNG THÁI</span><span>${state.running ? 'RUNNING' : 'READY'}</span></div>
                </div>
                <div class="grid-charts">
                    <div class="chart-card">
                        <div class="donut" style="background: conic-gradient(#3b82f6 ${state.progress || 0}%, #e2e8f0 0);">
                            <div class="donut-inner"><span style="font-size:20px;font-weight:900;">${state.progress || 0}%</span></div>
                        </div>
                    </div>
                    <div class="card" style="margin-bottom:0;">
                        <div class="card-title"><i class="fa-solid fa-chart-line"></i> Tiến Trình Dame</div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
                            <span style="font-size:12px;">Vòng: ${state.loopDone || 0} / ${state.loopCount || 0}</span>
                            <span style="font-size:14px;font-weight:900;">${state.progress || 0}%</span>
                        </div>
                        <div style="display:flex; gap:12px;">
                            <button class="btn" style="flex:1;" onclick="sendToTool('start')"><i class="fa-solid fa-play"></i> BẮT ĐẦU</button>
                            <button class="btn btn-danger" style="flex:1;" onclick="sendToTool('stop')"><i class="fa-solid fa-stop"></i> DỪNG</button>
                        </div>
                    </div>
                </div>
            `;
        } else if (currentTab === 'settings') {
            body.innerHTML = `
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-pen-to-square"></i> Cấu Hình Báo Cáo</div>
                    <div class="form-grid">
                        <div class="input-group"><label>TIKTOK ID</label><input type="text" id="set-id" value="${state.targetId || ''}"></div>
                        <div class="input-group"><label>EMAIL</label><input type="email" id="set-email" value="${state.email || ''}"></div>
                        <div class="input-group"><label>SỐ VÒNG LẶP</label><input type="number" id="set-loop" value="${state.loopCount || ''}"></div>
                    </div>
                    <div class="input-group" style="margin-top:16px;"><label>NỘI DUNG BÁO CÁO</label><textarea id="set-content" rows="4">${state.reportContent || ''}</textarea></div>
                    <button class="btn" style="margin-top:20px;" onclick="saveSettings()"><i class="fa-solid fa-floppy-disk"></i> LƯU CẤU HÌNH</button>
                </div>
            `;
        } else if (currentTab === 'accounts') {
            let rows = (state.accounts || []).map((acc, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td style="font-weight:900;">@${acc.id}</td>
                    <td><span class="badge ${acc.status === 'LIVE' ? 'live' : 'die'}">${acc.status}</span></td>
                    <td>${acc.loops || 0} lần</td>
                    <td><input type="text" value="${acc.price || ''}" placeholder="Giá..." style="width:80px;padding:4px;border:1px solid #ccc;border-radius:4px;" onchange="updateAcc('${acc.id}', 'price', this.value)"></td>
                    <td><button onclick="window.open('https://www.tiktok.com/@${acc.id}', '_blank')" style="border:none;background:none;cursor:pointer;color:#3b82f6;font-size:12px;font-weight:800;"><i class="fa-solid fa-arrow-up-right-from-square"></i> Mở</button></td>
                </tr>
            `).join('');
            body.innerHTML = `
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-users"></i> Quản Lý Account</div>
                    <div style="display:flex; gap:10px; margin-bottom:16px;">
                        <input type="text" id="new-acc-id" placeholder="Nhập ID TikTok cần check..." style="flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;">
                        <button class="btn" onclick="checkAcc()"><i class="fa-solid fa-plus"></i> CHECK & THÊM</button>
                    </div>
                    <table class="acc-table">
                        <thead><tr><th>STT</th><th>Tài Khoản</th><th>Trạng Thái</th><th>Dame</th><th>Giá</th><th>Hành Động</th></tr></thead>
                        <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:#888;">Chưa có account nào.</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        } else if (currentTab === 'logs') {
            body.innerHTML = `
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-terminal"></i> Lịch Sử Log</div>
                    <pre style="font-size:12px; white-space:pre-wrap;">${(state.logs || []).slice(0, 20).map(l => `[${l.time}] [${l.tag}] ${l.msg}`).join('\n')}</pre>
                </div>
            `;
        }
    }

    function saveSettings() {
        const id = document.getElementById('set-id').value;
        const email = document.getElementById('set-email').value;
        const loop = document.getElementById('set-loop').value;
        const content = document.getElementById('set-content').value;
        sendToTool('saveSettings', { id, email, loop, content });
        alert('Đã lưu cấu hình!');
    }

    function checkAcc() {
        const id = document.getElementById('new-acc-id').value.trim();
        if(!id) return;
        sendToTool('checkAcc', { id });
    }

    function updateAcc(id, field, val) {
        sendToTool('updateAcc', { id, field, value: val });
    }

    window.addEventListener('message', (e) => {
        if (e.data.action === 'updateState') {
            currentState = e.data.data.state;
            renderUI(currentState);
        }
    });

    sendToTool('getState');
</script>
</body>
</html>
